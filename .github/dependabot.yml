version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm-workspace.yaml `minimumReleaseAge: 1440` (24 h).
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    ignore:
      # v5 hangs: deployment is created but status never leaves "" until timeout.
      - dependency-name: actions/deploy-pages
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
