name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Builds every PR, so Dependabot auto-merge has a check to wait for.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22  # pnpm 11 needs Node 22+
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-cbb8af12-nhuus1' # TEMP: v5 diagnostic run
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-cbb8af12-nhuus1' # TEMP: v5 diagnostic run
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-cbb8af12-nhuus1' # TEMP: v5 diagnostic run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5  # TEMP: v5 diagnostic run
