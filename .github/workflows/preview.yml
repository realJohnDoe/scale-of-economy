name: PR preview

# Builds every PR, so Dependabot auto-merge has a check to wait for. A PR
# labelled `preview` is also deployed to pr-preview/pr-<N>/ on gh-pages, and
# removed again when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    # Adding another label (e.g. automerge) must not rebuild.
    if: >-
      github.event.action != 'closed'
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    uses: ./.github/workflows/ci.yml
    with:
      base-path: /scale-of-economy/pr-preview/pr-${{ github.event.number }}/

  preview:
    needs: ci
    # Removal on `closed` runs whether or not the label is still there.
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed'
        || (needs.ci.result == 'success' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    # Queue, never cancel. Production pushes to gh-pages from its own group;
    # the deploy action rebases and retries a rejected push.
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      # The preview action's cleanup on `closed` needs the checkout too.
      - name: Checkout
        uses: actions/checkout@v7
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./dist
