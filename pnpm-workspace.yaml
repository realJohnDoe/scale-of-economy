# Refuse package versions published less than 24 h ago (the pnpm 11 default,
# stated here so Dependabot's cooldown visibly matches it).
minimumReleaseAge: 1440

# Packages allowed to run install-time build scripts. Add one only after
# reviewing what its script does.
allowBuilds:
  esbuild: true

# GHSA-g3hv-75wg-m249: minimatch <11.0.1 glob-pattern DoS, lint-time only.
# Drop once `npm view @typescript-eslint/typescript-estree@latest dependencies.minimatch` allows 11.
overrides:
  'minimatch@>=7 <11.0.1': ^11.0.5
